services:
  postgres:
    image: postgres:16-alpine
    container_name: bank_source_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: SourcePass2026!
      POSTGRES_DB: orders_db
    volumes:
      - bank_source_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bank_network

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    container_name: bank_source_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Sabay Premium Bank Core Ledger (On Premises Baseline)"
      APP_ENV: "onprem-source"
      DATABASE_URL: "postgresql://app_user:SourcePass2026!@postgres:5432/orders_db"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bank_network

volumes:
  bank_source_pgdata:
    name: bank_source_pgdata

networks:
  bank_network:
    name: bank_source_network
    driver: bridge