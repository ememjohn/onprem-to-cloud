services:
  postgres:
    image: postgres:16-alpine
    container_name: oms_source_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: SourcePass2026!
      POSTGRES_DB: orders_db
    volumes:
      # Named volume for persistent database storage
      - oms_source_pgdata:/var/lib/postgresql/data
      # Mount init script so schema and seed data load on first boot
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oms_network

volumes:
  oms_source_pgdata:
    name: oms_source_pgdata

networks:
  oms_network:
    name: oms_source_network
    driver: bridge
