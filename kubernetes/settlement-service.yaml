apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-service
  namespace: sabay-core
  labels:
    app: settlement-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: settlement-service
  template:
    metadata:
      labels:
        app: settlement-service
    spec:
      containers:
      - name: settlement-service
        image: sabay-bank-settlement-service:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
        env:
        - name: APP_NAME
          value: "Sabay Premium Bank Settlement Service"
        - name: APP_PORT
          value: "8002"
        - name: ACCOUNT_SERVICE_URL
          value: "http://account-service.sabay-core.svc.cluster.local:8001"
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: settlement-service
  namespace: sabay-core
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    protocol: TCP
  selector:
    app: settlement-service
