text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.nt{font-size:13px;font-weight:600;fill:#0f172a}.ns{font-size:10.5px;fill:#64748b}.bl{font-size:11px;font-weight:600}.lt{font-size:9.5px;fill:#334155}.kt{font-size:10px;fill:#475569}
.ed{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fl{stroke-dasharray:6 10;animation:d 1s linear infinite}.sl{stroke-dasharray:6 10;animation:d 2.4s linear infinite}
@keyframes d{to{stroke-dashoffset:-16}}
@media(prefers-reduced-motion:reduce){.fl,.sl{animation:none}}
</style>
